name: Stiri pe Pagina Facebook

on:
  schedule:
    # verificare la fiecare 5 minute, 07:00–21:55 ora României (iarna, UTC+2); vara 08:00–22:55
    # limitele de postare (max/zi, pauză minimă) sunt în news_bot.py
    - cron: "*/5 5-19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test fără publicare (1 = da)"
        default: "1"
      extras:
        description: "Forțează postări programate (ex. bnr,bvb,weekly,report)"
        default: ""

permissions:
  contents: write   # pentru a salva posted.json și posts_log.json
  issues: write     # pentru raportul săptămânal

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rulează botul
        env:
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID || 'me' }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          EXTRAS_FORCE: ${{ github.event.inputs.extras || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python news_bot.py

      - name: Salvează istoricul postărilor
        if: always()
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add posted.json posts_log.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Actualizare istoric postări"
          # dacă între timp s-a modificat repo-ul (ex. cod nou), aducem modificările și reîncercăm,
          # altfel istoricul s-ar pierde și aceeași știre ar putea fi publicată de două ori
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep $((i * 5))
          done
          echo "::error::Nu am putut salva istoricul postărilor"
          exit 1
