name: Stiri pe Pagina Facebook

on:
  schedule:
    # la fiecare 2 ore, 08:17–18:17 ora României (iarna, UTC+2); vara se decalează cu o oră
    - cron: "17 6-16/2 * * 1-5"
    # weekend: de 2 ori pe zi
    - cron: "17 7,15 * * 0,6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test fără publicare (1 = da)"
        default: "1"

permissions:
  contents: write   # pentru a salva posted.json

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rulează botul
        env:
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID || 'me' }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python news_bot.py

      - name: Salvează istoricul postărilor
        if: always()
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add posted.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Actualizare istoric postări" && git push)
